<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VisionAI</title>
<style>
  :root {
    --bg: #11181f;
    --panel: #1a232d;
    --line: #2c3a48;
    --text: #f2f5f8;
    --muted: #9fb0c0;
    --accent: #ffb000;
    --accent-ink: #1b1200;
    --danger: #ff5a4d;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 14px; padding-bottom: 40px; }
  h1 { font-size: 1.35rem; margin: 6px 0 12px; letter-spacing: .01em; }
  .stage { position: relative; background: #000; border: 1px solid var(--line);
    border-radius: 10px; overflow: hidden; aspect-ratio: 4 / 3; }
  canvas { width: 100%; height: 100%; display: block; }
  .empty { position: absolute; inset: 0; display: grid; place-items: center;
    color: var(--muted); text-align: center; padding: 20px; font-size: 1rem; }
  .sources { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
  button { font: inherit; font-weight: 650; min-height: 54px; border-radius: 10px;
    border: 2px solid var(--line); background: var(--panel); color: var(--text); cursor: pointer; }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  button.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .row { display: flex; gap: 10px; margin-top: 10px; }
  .row > button { flex: 1; }
  .stop { border-color: var(--danger); color: var(--danger); }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 12px; margin-top: 12px; }
  label { display: block; font-size: .9rem; color: var(--muted); margin-bottom: 6px; }
  input[type=text], input[type=range] { width: 100%; }
  input[type=text] { min-height: 46px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--bg); color: var(--text); padding: 0 12px; font: inherit; }
  .hint { font-size: .82rem; color: var(--muted); margin: 8px 0 0; line-height: 1.45; }
  .status { margin-top: 12px; min-height: 1.5em; font-size: 1.05rem; }
  .hidden { display: none; }
</style>
</head>
<body>
<main>
  <h1>VisionAI</h1>

  <div class="stage">
    <canvas id="view" width="640" height="480"></canvas>
    <div class="empty" id="empty">Choose a camera below to start.</div>
  </div>

  <div class="sources">
    <button id="btnPhone">Phone camera</button>
    <button id="btnEsp">ESP32-CAM</button>
  </div>
  <div class="row">
    <button id="btnVoice" class="on">Voice: on</button>
    <button id="btnStop" class="stop">Stop</button>
  </div>

  <div class="panel hidden" id="espPanel">
    <label for="espUrl">ESP32-CAM stream address</label>
    <input type="text" id="espUrl" inputmode="url" autocapitalize="off" autocomplete="off"
           placeholder="http://192.168.1.50:81/stream">
    <div class="row"><button id="btnConnect" class="on">Connect</button></div>
    <p class="hint">Use the same Wi-Fi as the ESP32-CAM. The address is shown in the Arduino Serial Monitor.
      If the page is on https and the picture stays blank, allow “Insecure content” for this site in the browser settings.</p>
  </div>

  <div class="panel">
    <label for="fov">Camera view angle: <span id="fovVal">60</span>°  (improves distance accuracy)</label>
    <input type="range" id="fov" min="40" max="100" value="60">
  </div>

  <div class="status" id="status" aria-live="polite"></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js"></script>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const canvas = $('view'), ctx = canvas.getContext('2d');
  const video = document.createElement('video');
  video.playsInline = true; video.muted = true;
  const espImg = new Image();
  espImg.crossOrigin = 'anonymous';

  let model = null, source = null, running = false, voiceOn = true;
  let lastSpoken = '', lastSpokenAt = 0, stream = null, lastDetect = 0, preds = [];

  // Typical real-world heights in metres, used to estimate distance from box size.
  const HEIGHT = {
    person: 1.7, bicycle: 1.0, car: 1.5, motorcycle: 1.1, bus: 3.0, truck: 3.0,
    'traffic light': 0.8, 'fire hydrant': 0.7, 'stop sign': 0.75, bench: 0.85,
    cat: 0.25, dog: 0.5, backpack: 0.45, umbrella: 0.8, handbag: 0.3, suitcase: 0.6,
    bottle: 0.25, cup: 0.1, chair: 0.9, couch: 0.9, 'potted plant': 0.5, bed: 0.6,
    'dining table': 0.75, toilet: 0.4, tv: 0.5, laptop: 0.25, refrigerator: 1.7,
    sink: 0.3, oven: 0.6, microwave: 0.3, book: 0.22, vase: 0.3, clock: 0.3
  };

  const say = (text, urgent) => {
    if (!voiceOn || !('speechSynthesis' in window)) return;
    const synth = window.speechSynthesis;
    if (urgent) synth.cancel();
    else if (synth.speaking) return;
    const u = new SpeechSynthesisUtterance(text);
    u.rate = 1.05;
    synth.speak(u);
  };
  const setStatus = t => { $('status').textContent = t; };

  const metresText = d => {
    if (d < 0.5) return 'very close';
    const r = Math.round(d * 2) / 2;
    return r === 1 ? '1 metre' : r + ' metres';
  };

  // --- Model ---
  async function loadModel() {
    if (model) return;
    setStatus('Loading AI model…'); say('Loading');
    model = await cocoSsd.load({ base: 'lite_mobilenet_v2' });
    setStatus('Model ready.');
  }

  // --- Sources ---
  function stopAll() {
    running = false; source = null; preds = [];
    if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
    video.srcObject = null; espImg.src = '';
    window.speechSynthesis && window.speechSynthesis.cancel();
    $('btnPhone').classList.remove('on'); $('btnEsp').classList.remove('on');
    $('empty').classList.remove('hidden');
    ctx.clearRect(0, 0, canvas.width, canvas.height);
  }

  async function startPhone() {
    stopAll();
    $('espPanel').classList.add('hidden');
    try {
      await loadModel();
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: 'environment' }, width: { ideal: 640 }, height: { ideal: 480 } }, audio: false });
      video.srcObject = stream; await video.play();
      source = 'phone'; begin('Phone camera');
    } catch (e) {
      setStatus('Camera blocked or unavailable. Allow camera access and try again.');
      say('Camera unavailable');
    }
  }

  async function startEsp() {
    stopAll();
    $('espPanel').classList.remove('hidden');
    const url = $('espUrl').value.trim();
    if (!url) { setStatus('Enter the ESP32-CAM stream address first.'); say('Enter the camera address'); return; }
    try { localStorage.setItem('visionai_esp', url); } catch (e) {}
    try { await loadModel(); } catch (e) { setStatus('Could not load the AI model. Check internet.'); return; }
    espImg.onerror = () => { if (source === 'esp') { setStatus('Cannot reach the ESP32-CAM. Check Wi-Fi and the address.'); say('Cannot reach the camera'); } };
    source = 'esp';
    espImg.src = url;
    begin('ESP32-CAM');
  }

  function begin(name) {
    running = true;
    $('empty').classList.add('hidden');
    $('btnPhone').classList.toggle('on', source === 'phone');
    $('btnEsp').classList.toggle('on', source === 'esp');
    setStatus(name + ' live.'); say(name + ' on');
    requestAnimationFrame(loop);
  }

  // --- Main loop ---
  function frameEl() {
    if (source === 'phone' && video.videoWidth) return { el: video, w: video.videoWidth, h: video.videoHeight };
    if (source === 'esp' && espImg.naturalWidth) return { el: espImg, w: espImg.naturalWidth, h: espImg.naturalHeight };
    return null;
  }

  async function loop(ts) {
    if (!running) return;
    const f = frameEl();
    if (f) {
      if (canvas.width !== f.w || canvas.height !== f.h) { canvas.width = f.w; canvas.height = f.h; }
      ctx.drawImage(f.el, 0, 0, f.w, f.h);
      if (ts - lastDetect > 180 && model) {
        lastDetect = ts;
        try { preds = analyse(await model.detect(f.el, 12, 0.5), f.w, f.h); }
        catch (e) { /* tainted canvas or frame not ready */ }
        announce(preds);
      }
      draw(preds, f.w, f.h);
    }
    requestAnimationFrame(loop);
  }

  function analyse(dets, W, H) {
    const fov = +$('fov').value * Math.PI / 180;
    const focal = H / (2 * Math.tan(fov / 2));
    return dets.map(d => {
      const [x, y, w, h] = d.bbox;
      const real = HEIGHT[d.class] || 0.5;
      let dist = real * focal / Math.max(h, 1);
      const clipped = y <= 4 || y + h >= H - 4;
      if (clipped) dist = Math.min(dist, 1.0);
      const cx = (x + w / 2) / W;
      const dir = cx < 0.37 ? 'on your left' : cx > 0.63 ? 'on your right' : 'ahead';
      return { name: d.class, x, y, w, h, dist, dir };
    }).sort((a, b) => a.dist - b.dist);
  }

  function draw(list, W, H) {
    const s = Math.max(W / 640, 1);
    ctx.lineWidth = 3 * s;
    ctx.font = `${Math.round(13 * s)}px system-ui, sans-serif`;
    ctx.textBaseline = 'middle';
    list.forEach(o => {
      const close = o.dist < 1;
      const color = close ? '#ff5a4d' : '#ffb000';
      ctx.strokeStyle = color; ctx.strokeRect(o.x, o.y, o.w, o.h);
      const label = `${o.name} · ${o.dist < 0.5 ? '<0.5' : o.dist.toFixed(1)} m`;
      const tw = ctx.measureText(label).width + 10 * s, th = 20 * s;
      const ly = o.y - th < 0 ? o.y : o.y - th;
      ctx.fillStyle = color; ctx.fillRect(o.x, ly, tw, th);
      ctx.fillStyle = '#1b1200'; ctx.fillText(label, o.x + 5 * s, ly + th / 2);
    });
  }

  function announce(list) {
    const near = list.filter(o => o.dist <= 4).slice(0, 2);
    if (!near.length) { lastSpoken = ''; return; }
    const msg = near.map(o => `${o.name} ${o.dir}, ${metresText(o.dist)}`).join('. ');
    const key = near.map(o => o.name + o.dir + Math.round(o.dist * 2)).join('|');
    const now = Date.now();
    const urgent = near[0].dist < 0.7;
    if (key !== lastSpoken || now - lastSpokenAt > 5000) {
      if (!window.speechSynthesis.speaking || urgent) {
        say((urgent ? 'Careful. ' : '') + msg, urgent);
        lastSpoken = key; lastSpokenAt = now;
        setStatus(msg);
      }
    }
  }

  // --- UI ---
  $('btnPhone').onclick = startPhone;
  $('btnEsp').onclick = startEsp;
  $('btnConnect').onclick = startEsp;
  $('btnStop').onclick = () => { stopAll(); setStatus('Stopped.'); };
  $('btnVoice').onclick = e => {
    voiceOn = !voiceOn;
    e.target.textContent = 'Voice: ' + (voiceOn ? 'on' : 'off');
    e.target.classList.toggle('on', voiceOn);
    if (!voiceOn) window.speechSynthesis.cancel();
  };
  $('fov').oninput = e => { $('fovVal').textContent = e.target.value; };
  try { const saved = localStorage.getItem('visionai_esp'); if (saved) $('espUrl').value = saved; } catch (e) {}
})();
</script>
</body>
</html>
